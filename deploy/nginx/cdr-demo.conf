# 化学部检测报告系统 — Nginx 前后端解耦部署示例（P3）
#
# 拓扑：Nginx 直接托管前端构建产物 client/dist（静态文件），
#       并把 /api/* 反向代理到只跑 API 的 Node 进程。
# 与单进程部署的区别：单进程是 Node 自己 express.static 托管 dist + 跑 API；
# 解耦后静态文件交给 Nginx（更快、更省 Node 资源），Node 只管 /api。
# 应用代码无需任何改动——前端用相对路径 /api（见 client/src/config.ts），同源反代天然无 CORS。
#
# 用法：
#   1) 把本文件拷到 /etc/nginx/conf.d/cdr-demo.conf（按发行版也可能是 sites-available + 软链 sites-enabled）
#   2) 改下面三处实际值：server_name、root（指向真实部署路径的 client/dist）、proxy_pass 端口
#   3) Node 端只跑 API 并绑回环：HOST=127.0.0.1 PORT=3001 pnpm serve
#      （绑 127.0.0.1 后该端口不对外暴露，只有本机 Nginx 能连——更安全）
#   4) nginx -t 校验 && systemctl reload nginx

server {
    listen 80;
    # 内网可填服务器 IP 或域名；用 _ 表示匹配任意 Host
    server_name _;

    # 前端构建产物（pnpm build 生成）。改成真实部署路径，例如 /opt/cdr-demo/client/dist
    root /path/to/demo_v1/client/dist;
    index index.html;

    # 上传上限：后端 multer/json 限 10MB，这里给到 12m 留余量（Nginx 默认仅 1m，不放开会 413）
    client_max_body_size 12m;

    # 静态资源 gzip（PDF 已是压缩格式，不重复压）
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 所有后端接口 / 上传 / 图片 / 外部推送都在 /api 下 —— 统一反代到 Node
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 报告生成 / typst 编译可能耗时数秒，且并发受 TYPST_MAX_CONCURRENCY 限流会排队，
        # 故放宽读超时，避免 504。
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # 前端是 SPA：非 /api 的路径一律回退到 index.html，由前端路由接管
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# HTTPS（可选）：内网通常 HTTP 即可（安全靠内网/IP 白名单）。要证书时把上面的 server 块
# 改 listen 443 ssl 并加 ssl_certificate / ssl_certificate_key，再加一个 80→443 跳转 server 即可。
# 应用代码不变。
